<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Vòng Quay May Mắn - Cổng Trời Đông Giang</title>
    <style>
        /* 1. HỆ THỐNG MÀU SẮC & CẤU TRÚC */
        :root {
            --primary-green: #014321;
            --prize-red: #e60000;
            --light-green: #c1f0c1;
            --white: #ffffff;
        }

        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
        
        body {
            margin: 0; padding: 0;
            display: flex; justify-content: center; align-items: center;
            height: 100dvh; background-color: var(--primary-green);
            font-family: -apple-system, system-ui, sans-serif;
            overflow: hidden;
        }

        /* 2. BỐ CỤC DISPLAY */
        .poster-container {
            position: relative;
            height: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
            width: fit-content;
        }

        .bg-img {
            max-height: 100dvh;
            max-width: 100vw;
            display: block;
            object-fit: contain;
        }

        .wheel-area {
            position: absolute;
            top: 65.3%; 
            left: 50%;
            width: 89%; 
            transform: translate(-50%, -50%);
            z-index: 5;
        }

        .wheel-img {
            width: 100%;
            height: auto;
            /* Thời gian 5s khớp hoàn toàn với file âm thanh quay xổ số */
            transition: transform 5s cubic-bezier(0.15, 0, 0.15, 1);
            will-change: transform;
            -webkit-backface-visibility: hidden;
        }

        .start-btn {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 32.5%;
            cursor: pointer;
            z-index: 10;
            touch-action: manipulation;
            transition: transform 0.2s;
        }

        .start-btn:active { transform: translate(-50%, -50%) scale(0.9); }

        /* 3. MODAL THÔNG BÁO */
        .modal-overlay {
            position: fixed; inset: 0;
            background: rgba(0,0,0,0.85);
            display: none; justify-content: center; align-items: center;
            z-index: 100;
        }

        .modal-content {
            background: var(--white);
            width: 85%; max-width: 350px;
            padding: 40px 20px 30px;
            border-radius: 25px; text-align: center;
            position: relative;
            animation: zoomIn 0.3s ease-out;
        }

        @keyframes zoomIn { from { opacity: 0; transform: scale(0.8); } to { opacity: 1; transform: scale(1); } }

        .close-x { position: absolute; top: 15px; right: 20px; font-size: 30px; color: #ccc; cursor: pointer; }

        .modal-content h2 { 
            color: var(--primary-green) !important; 
            margin: 0; font-size: 22px; font-weight: 800;
            text-transform: uppercase;
        }

        .modal-content p { color: #444; font-size: 18px; margin: 20px 0 0; }

        .modal-content b {
            color: var(--prize-red) !important; 
            font-size: 24px;
            display: block;
            margin-top: 15px;
            margin-bottom: 30px;
            font-weight: 800;
        }

        .zalo-btn {
            display: inline-block;
            background-color: var(--light-green); color: #004d26;
            text-decoration: none; padding: 15px 20px;
            border-radius: 12px; font-weight: 700; font-size: 12px;
            text-transform: uppercase; border: 1px solid #a8e0a8;
        }

        .out-of-turns { filter: grayscale(1); cursor: not-allowed; opacity: 0.8; }
    </style>
</head>
<body>

    <!-- Âm thanh duy nhất từ file bạn gửi -->
    <audio id="gameSound" src="am-thanh.MP3" preload="auto"></audio>

    <div class="poster-container">
        <!-- Ảnh nền Poster -->
        <img src="nen-back.jpg" class="bg-img">

        <div class="wheel-area">
            <!-- Vòng quay hình ảnh -->
            <img src="vong-xoay.png" id="wheel" class="wheel-img">
            <!-- Nút quay / Kim chỉ -->
            <img src="nut-quay.png" class="start-btn" id="spin-button" onclick="startSpin()">
        </div>
    </div>

    <!-- Modal nhận quà -->
    <div class="modal-overlay" id="modal">
        <div class="modal-content">
            <span class="close-x" onclick="closeModal()">&times;</span>
            <h2>CỔNG TRỜI ĐÔNG GIANG</h2>
            <p>Chúc mừng bạn đã nhận được:</p>
            <b id="prize-name"></b>
            <a href="https://zalo.me/1049758536530278164" target="_blank" class="zalo-btn">Zalo OA Cổng Trời Đông Giang</a>
        </div>
    </div>

    <script>
        // --- CẤU HÌNH QUÀ TẶNG (Phải khớp thứ tự trên ảnh từ Đỉnh quay theo chiều kim đồng hồ) ---
        const prizes = [
            { name: "TÚI VẢI", weight: 30 },             // Vị trí 0 độ (Đỉnh)
            { name: "MIỄN PHÍ VÉ THAM QUAN", weight: 5 }, // Vị trí 60 độ
            { name: "TÚI CÓI", weight: 15 },             // Vị trí 120 độ
            { name: "STICKER", weight: 15 },            // Vị trí 180 độ
            { name: "VOUCHER GIẢM 100K", weight: 5 },   // Vị trí 240 độ
            { name: "QUẠT", weight: 30 }                // Vị trí 300 độ
        ];

        const MAX_SPINS = 20;
        let isSpinning = false;
        let totalRotation = 0; 
        let spinCount = parseInt(localStorage.getItem('spin_dg_v20')) || 0;

        const wheel = document.getElementById('wheel');
        const spinBtn = document.getElementById('spin-button');
        const gameSound = document.getElementById('gameSound');

        // Kiểm tra lượt quay khi load trang
        if (spinCount >= MAX_SPINS) spinBtn.classList.add('out-of-turns');

        function startSpin() {
            if (isSpinning) return;
            if (spinCount >= MAX_SPINS) {
                alert("Bạn đã tham gia đủ 20 lượt quay!");
                return;
            }

            isSpinning = true;

            // 1. PHÁT ÂM THANH (Tiếng quay 5s đầu sẽ khớp với chuyển động)
            gameSound.currentTime = 0;
            gameSound.play().catch(e => console.log("Cần click để phát nhạc"));

            // 2. THUẬT TOÁN TỈ LỆ (Weighted Random)
            let totalWeight = prizes.reduce((sum, p) => sum + p.weight, 0);
            let random = Math.floor(Math.random() * totalWeight);
            let cumulativeWeight = 0;
            let prizeIndex = 0;

            for (let i = 0; i < prizes.length; i++) {
                cumulativeWeight += prizes[i].weight;
                if (random < cumulativeWeight) {
                    prizeIndex = i;
                    break;
                }
            }

            // 3. TÍNH TOÁN GÓC QUAY ĐỂ KIM DỪNG ĐÚNG Ô
            const segmentDeg = 360 / prizes.length; // 60 độ mỗi ô
            
            // Tính góc dừng sao cho ô prizeIndex nằm ở Đỉnh (12h)
            // Công thức: (Vòng quay hiện tại) + (Ít nhất 5 vòng mới) + (Góc bù để trúng ô)
            const targetAngle = 360 - (prizeIndex * segmentDeg);
            
            // Thêm chút ngẫu nhiên để kim không dừng mãi một chỗ giữa ô (lệch nhẹ 10-20 độ)
            const randomOffset = (Math.random() * (segmentDeg * 0.4)) - (segmentDeg * 0.2);
            
            const minSpins = 1800; // Quay tối thiểu 5 vòng (360 * 5)
            
            // Tổng góc quay tích lũy
            const currentExtra = minSpins + targetAngle + randomOffset;
            totalRotation += currentExtra;

            // Thực hiện hiệu ứng quay CSS
            wheel.style.transform = `rotate(${totalRotation}deg)`;

            // 4. KẾT THÚC (Sau 5 giây)
            setTimeout(() => {
                isSpinning = false;
                
                // Tiếng vỗ tay trong file của bạn sẽ vang lên lúc này
                spinCount++;
                localStorage.setItem('spin_dg_v20', spinCount);
                if (spinCount >= MAX_SPINS) spinBtn.classList.add('out-of-turns');
                
                showModal(prizes[prizeIndex].name);
            }, 5000); // 5000ms = 5s
        }

        function showModal(name) {
            document.getElementById('prize-name').innerText = name;
            document.getElementById('modal').style.display = 'flex';
        }

        function closeModal() {
            document.getElementById('modal').style.display = 'none';
            // Không tắt nhạc ngay để tiếng vỗ tay được vang hết
        }
    </script>
</body>
</html>
