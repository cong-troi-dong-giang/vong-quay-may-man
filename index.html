<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Vòng Quay May Mắn - Cổng Trời Đông Giang</title>
    <style>
        /* 1. KHAI BÁO BIẾN & THIẾT LẬP CHUNG */
        :root {
            --primary-green: #014321;
            --light-green: #c1f0c1;
            --dark-text: #444;
            --transition-speed: 5s;
        }

        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
        
        body {
            margin: 0; padding: 0;
            display: flex; justify-content: center; align-items: center;
            height: 100dvh; background: var(--primary-green);
            font-family: -apple-system, system-ui, sans-serif;
            overflow: hidden;
        }

        /* 2. BỐ CỤC POSTER & VÒNG QUAY */
        .poster-container { position: relative; height: 100%; display: flex; align-items: center; }
        
        .bg-img { max-height: 100%; max-width: 100vw; display: block; object-fit: contain; }

        .wheel-area {
            position: absolute;
            top: 65.3%; left: 50%; width: 89%;
            transform: translate(-50%, -50%);
            z-index: 2; line-height: 0;
        }

        .wheel-img {
            width: 100%; height: auto;
            transition: transform var(--transition-speed) cubic-bezier(0.1, 0, 0.1, 1);
            will-change: transform; /* Tối ưu hiệu năng GPU */
        }

        .start-btn {
            position: absolute; top: 50%; left: 50%;
            transform: translate(-50%, -50%);
            width: 32.5%; cursor: pointer; z-index: 10;
        }

        /* 3. MODAL THÔNG BÁO */
        .modal-overlay {
            position: fixed; inset: 0; background: rgba(0,0,0,0.8);
            display: none; justify-content: center; align-items: center; z-index: 100;
        }

        .modal-content {
            background: #fff; width: 88%; max-width: 360px;
            padding: 40px 20px 30px; border-radius: 25px;
            text-align: center; position: relative;
            animation: zoomIn 0.3s ease-out;
        }

        @keyframes zoomIn { from { opacity: 0; transform: scale(0.8); } to { opacity: 1; transform: scale(1); } }

        .close-x { position: absolute; top: 15px; right: 20px; font-size: 30px; color: #ccc; cursor: pointer; }

        .modal-content h2 { 
            color: var(--primary-green); /* Đã đổi sang màu xanh */
            margin: 0; font-size: 24px; font-weight: 800; 
        }

        .modal-content b { color: #000; font-size: 21px; display: block; margin: 25px 0; }

        .zalo-btn {
            display: inline-block; background: var(--light-green); color: #004d26;
            text-decoration: none; padding: 15px 25px; border-radius: 12px;
            font-weight: 700; font-size: 12px; text-transform: uppercase;
            border: 1px solid #a8e0a8;
        }

        .out-of-turns { filter: grayscale(1); cursor: not-allowed; }
    </style>
</head>
<body>

    <!-- PHẦN HIỂN THỊ CHÍNH -->
    <div class="poster-container">
        <img src="nen-back.jpg" class="bg-img" id="poster">
        <div class="wheel-area" id="wheel-box">
            <img src="vong-xoay.png" id="wheel" class="wheel-img">
            <img src="nut-quay.png" class="start-btn" id="spin-button" onclick="startSpin()">
        </div>
    </div>

    <!-- PHẦN THÔNG BÁO -->
    <div class="modal-overlay" id="modal">
        <div class="modal-content">
            <span class="close-x" onclick="closeModal()">&times;</span>
            <h2>CỔNG TRỜI ĐÔNG GIANG</h2>
            <p>Chúc mừng bạn đã nhận được:</p>
            <b id="prize-name"></b>
            <a href="https://zalo.me/1049758536530278164" target="_blank" class="zalo-btn">Zalo OA Cổng Trời Đông Giang</a>
        </div>
    </div>

    <script>
        // --- KHAI BÁO DỮ LIỆU ---
        const prizes = [
            { name: "TÚI VẢI" }, { name: "VOUCHER MIỄN PHÍ VÉ THAM QUAN" }, 
            { name: "TÚI CÓI" }, { name: "STICKER" }, 
            { name: "VOUCHER GIẢM 100K" }, { name: "QUẠT" }         
        ];
        
        let isSpinning = false;
        let currentRotation = 0; // Lưu trữ góc quay tích lũy
        let spinCount = parseInt(localStorage.getItem('spin_dg_final_v12')) || 0;

        const wheel = document.getElementById('wheel');
        const spinBtn = document.getElementById('spin-button');

        // Kiểm tra lượt quay ngay khi tải trang
        if (spinCount >= 2) spinBtn.classList.add('out-of-turns');

        // --- HÀM XỬ LÝ CHÍNH ---

        // Tự động căn chỉnh kích thước vòng quay
        function adjustWheel() {
            const poster = document.getElementById('poster');
            if (poster.complete) {
                document.getElementById('wheel-box').style.width = (poster.clientWidth * 0.89) + "px";
            }
        }
        window.addEventListener('resize', adjustWheel);
        document.getElementById('poster').addEventListener('load', adjustWheel);

        function startSpin() {
            if (isSpinning || spinCount >= 2) {
                if (spinCount >= 2) alert("Bạn đã tham gia đủ 2 lượt quay!");
                return;
