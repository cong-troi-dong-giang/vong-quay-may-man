<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Vòng Quay May Mắn - Cổng Trời Đông Giang</title>
    <style>
        /* 1. KHAI BÁO BIẾN & THIẾT LẬP HỆ THỐNG */
        :root {
            --primary-green: #014321;
            --prize-red: #e60000;
            --light-green: #c1f0c1;
            --white: #ffffff;
        }

        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
        
        body {
            margin: 0; padding: 0;
            display: flex; justify-content: center; align-items: center;
            height: 100dvh; background-color: var(--primary-green);
            font-family: -apple-system, system-ui, sans-serif;
            overflow: hidden;
        }

        /* 2. BỐ CỤC POSTER (Tối ưu Mobile 100%) */
        .poster-container {
            position: relative;
            height: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
            width: fit-content;
        }

        .bg-img {
            max-height: 100dvh;
            max-width: 100vw;
            display: block;
            object-fit: contain;
        }

        /* Vùng chứa vòng quay dùng % thay vì Pixel để tránh lỗi không quay trên điện thoại */
        .wheel-area {
            position: absolute;
            top: 65.3%; 
            left: 50%;
            width: 89%; /* Khớp với bóng đèn trên poster */
            transform: translate(-50%, -50%);
            z-index: 5;
        }

        .wheel-img {
            width: 100%;
            height: auto;
            transition: transform 5s cubic-bezier(0.1, 0, 0.1, 1);
            will-change: transform;
            -webkit-backface-visibility: hidden;
        }

        .start-btn {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 32.5%;
            cursor: pointer;
            z-index: 10;
            touch-action: manipulation;
        }

        /* 3. MODAL NHẬN THƯỞNG */
        .modal-overlay {
            position: fixed; inset: 0;
            background: rgba(0,0,0,0.85);
            display: none; justify-content: center; align-items: center;
            z-index: 100;
        }

        .modal-content {
            background: var(--white);
            width: 85%; max-width: 350px;
            padding: 40px 20px 30px;
            border-radius: 25px; text-align: center;
            position: relative;
            animation: zoomIn 0.3s ease-out;
        }

        @keyframes zoomIn { from { opacity: 0; transform: scale(0.8); } to { opacity: 1; transform: scale(1); } }

        .close-x { position: absolute; top: 15px; right: 20px; font-size: 30px; color: #ccc; cursor: pointer; }

        /* Chữ Cổng Trời Đông Giang -> Màu Xanh Lá */
        .modal-content h2 { 
            color: var(--primary-green) !important; 
            margin: 0; font-size: 22px; font-weight: 800;
            text-transform: uppercase;
        }

        .modal-content p { color: #444; font-size: 18px; margin: 20px 0 0; }

        /* Tên quà tặng -> Màu Đỏ & Xịt xuống dưới */
        .modal-content b {
            color: var(--prize-red) !important; 
            font-size: 24px;
            display: block;
            margin-top: 15px; /* Đẩy quà xịt xuống */
            margin-bottom: 30px;
            font-weight: 800;
        }

        .zalo-btn {
            display: inline-block;
            background-color: var(--light-green); color: #004d26;
            text-decoration: none; padding: 15px 20px;
            border-radius: 12px; font-weight: 700; font-size: 12px;
            text-transform: uppercase; border: 1px solid #a8e0a8;
        }

        .out-of-turns { filter: grayscale(1); cursor: not-allowed; opacity: 0.8; }
    </style>
</head>
<body>

    <div class="poster-container">
        <img src="nen-back.jpg" class="bg-img">

        <div class="wheel-area">
            <img src="vong-xoay.png" id="wheel" class="wheel-img">
            <img src="nut-quay.png" class="start-btn" id="spin-button" onclick="startSpin()">
        </div>
    </div>

    <!-- Modal Thông báo -->
    <div class="modal-overlay" id="modal">
        <div class="modal-content">
            <span class="close-x" onclick="closeModal()">&times;</span>
            <h2>CỔNG TRỜI ĐÔNG GIANG</h2>
            <p>Chúc mừng bạn đã nhận được:</p>
            <b id="prize-name"></b>
            <a href="https://zalo.me/1049758536530278164" target="_blank" class="zalo-btn">Zalo OA Cổng Trời Đông Giang</a>
        </div>
    </div>

    <script>
        // --- CẤU HÌNH DỮ LIỆU ---
        const MAX_SPINS = 20;
        const prizes = [
            { name: "TÚI VẢI", weight: 30 },    
            { name: "MIỄN PHÍ VÉ THAM QUAN", weight: 5 }, 
            { name: "TÚI CÓI", weight: 15 },   
            { name: "STICKER", weight: 15 }, 
            { name: "VOUCHER GIẢM 100K", weight: 5 },          
            { name: "QUẠT", weight: 30 }       
        ];

        let isSpinning = false;
        let currentRotation = 0; 
        let spinCount = parseInt(localStorage.getItem('spin_dg_v20')) || 0;

        const wheel = document.getElementById('wheel');
        const spinBtn = document.getElementById('spin-button');

        if (spinCount >= MAX_SPINS) spinBtn.classList.add('out-of-turns');

        // --- LOGIC CHÍNH ---
        function startSpin() {
            if (isSpinning) return;
            if (spinCount >= MAX_SPINS) {
                alert("Bạn đã tham gia đủ 20 lượt quay!");
                return;
            }

            isSpinning = true;

            // 1. Thuật toán tỉ lệ trúng thưởng (Weighted Random)
            let totalWeight = prizes.reduce((sum, p) => sum + p.weight, 0);
            let random = Math.floor(Math.random() * totalWeight);
            let cumulativeWeight = 0;
            let prizeIndex = 0;

            for (let i = 0; i < prizes.length; i++) {
                cumulativeWeight += prizes[i].weight;
                if (random < cumulativeWeight) {
                    prizeIndex = i;
                    break;
                }
            }

            // 2. Tính toán góc quay (Quay 1 chiều kim đồng hồ)
            const segmentDeg = 360 / prizes.length; 
            // Mũi tên ở vị trí 3 giờ (90 độ)
            const stopOffset = 90 - (prizeIndex * segmentDeg) - (segmentDeg / 2);
            
            // Luôn cộng thêm 3600 độ (10 vòng) vào góc hiện tại để đảm bảo quay xuôi chiều
            const minSpins = 3600; 
            const currentMod = currentRotation % 360;
            let extraDeg = (stopOffset - currentMod + 360) % 360;
            
            if (extraDeg < 60) extraDeg += 360; 

            currentRotation += minSpins + extraDeg;
            wheel.style.transform = `rotate(${currentRotation}deg)`;

            // 3. Kết thúc quay
            setTimeout(() => {
                isSpinning = false;
                spinCount++;
                localStorage.setItem('spin_dg_v20', spinCount);
                if (spinCount >= MAX_SPINS) spinBtn.classList.add('out-of-turns');
                
                showModal(prizes[prizeIndex].name);
            }, 5200);
        }

        function showModal(name) {
            document.getElementById('prize-name').innerText = name;
            document.getElementById('modal').style.display = 'flex';
        }

        function closeModal() {
            document.getElementById('modal').style.display = 'none';
        }
    </script>
</body>
</html>
