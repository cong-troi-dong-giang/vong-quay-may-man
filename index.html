<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Vòng Quay May Mắn - Cổng Trời Đông Giang</title>
    <style>
        /* =========================================
           1. THIẾT LẬP CHUNG & BIẾN (TỐI ƯU)
           ========================================= */
        :root {
            --primary-green: #014321; /* Màu xanh thương hiệu */
            --light-green: #c1f0c1;
            --white: #ffffff;
            --transition-time: 5s; 
        }

        * { 
            box-sizing: border-box; 
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            margin: 0; padding: 0;
            display: flex; justify-content: center; align-items: center;
            height: 100dvh; background-color: var(--primary-green);
            overflow: hidden;
        }

        /* =========================================
           2. POSTER & VÒNG QUAY
           ========================================= */
        .poster-container {
            position: relative;
            height: 100%;
            display: flex; align-items: center; justify-content: center;
        }

        .bg-img {
            max-height: 100%; max-width: 100vw;
            display: block; object-fit: contain;
            z-index: 1;
        }

        .wheel-area {
            position: absolute;
            top: 65.3%; left: 50%;
            width: 89%;
            transform: translate(-50%, -50%);
            z-index: 2; line-height: 0;
        }

        .wheel-img {
            width: 100%; height: auto;
            /* Thiết lập quay mượt mà */
            transition: transform var(--transition-time) cubic-bezier(0.1, 0, 0.1, 1);
            will-change: transform;
        }

        .start-btn {
            position: absolute;
            top: 50%; left: 50%;
            transform: translate(-50%, -50%);
            width: 32.5%; cursor: pointer; z-index: 10;
        }

        /* =========================================
           3. MODAL THÔNG BÁO (CHỮ XANH)
           ========================================= */
        .modal-overlay {
            position: fixed; inset: 0;
            background: rgba(0,0,0,0.85);
            display: none; justify-content: center; align-items: center;
            z-index: 100;
        }

        .modal-content {
            background: var(--white);
            width: 88%; max-width: 360px;
            padding: 40px 20px 30px; border-radius: 25px;
            text-align: center; position: relative; 
            box-shadow: 0 15px 50px rgba(0,0,0,0.5);
            animation: zoomIn 0.3s ease-out;
        }

        @keyframes zoomIn { 
            from { opacity: 0; transform: scale(0.8); } 
            to { opacity: 1; transform: scale(1); } 
        }

        .close-x {
            position: absolute; top: 15px; right: 20px;
            font-size: 30px; color: #ccc; cursor: pointer;
        }

        /* ĐÃ SỬA: Chữ Cổng Trời Đông Giang luôn là màu xanh */
        .modal-content h2 { 
            color: var(--primary-green) !important; 
            margin: 0; font-size: 22px; font-weight: 800;
            text-transform: uppercase;
        }

        .modal-content p { color: #444; font-size: 18px; margin: 25px 0 5px; }

        .modal-content b {
            color: #000; font-size: 20px;
            display: block; margin-bottom: 30px; font-weight: 700;
        }

        .zalo-btn {
            display: inline-block;
            background-color: var(--light-green); color: #004d26;
            text-decoration: none; padding: 15px 20px;
            border-radius: 12px; font-weight: 700; font-size: 12px;
            text-transform: uppercase; border: 1px solid #a8e0a8;
        }

        .out-of-turns { filter: grayscale(1); cursor: not-allowed !important; }
    </style>
</head>
<body>

    <div class="poster-container">
        <img src="nen-back.jpg" class="bg-img" id="poster">

        <div class="wheel-area" id="wheel-box">
            <img src="vong-xoay.png" id="wheel" class="wheel-img">
            <img src="nut-quay.png" class="start-btn" id="spin-button" onclick="startSpin()">
        </div>
    </div>

    <div class="modal-overlay" id="modal">
        <div class="modal-content">
            <span class="close-x" onclick="closeModal()">&times;</span>
            <h2>CỔNG TRỜI ĐÔNG GIANG</h2>
            <p>Chúc mừng bạn đã nhận được:</p>
            <b id="prize-name"></b>
            <a href="https://zalo.me/1049758536530278164" target="_blank" class="zalo-btn">Zalo OA Cổng Trời Đông Giang</a>
        </div>
    </div>

    <script>
        /* =========================================
           4. LOGIC QUAY (CHUYÊN NGHIỆP)
           ========================================= */
        
        const prizes = [
            { name: "TÚI VẢI" },           
            { name: "VOUCHER MIỄN PHÍ VÉ THAM QUAN" }, 
            { name: "TÚI CÓI" },           
            { name: "STICKER" }, 
            { name: "VOUCHER GIẢM 100K" },            
            { name: "QUẠT" }         
        ];

        let isSpinning = false;
        let currentRotation = 0; 
        
        let spinCount = parseInt(localStorage.getItem('spin_dg_v12')) || 0;
        const spinBtn = document.getElementById('spin-button');
        const wheelImg = document.getElementById('wheel');

        // Giới hạn 2 lượt quay
        if (spinCount >= 2) spinBtn.classList.add('out-of-turns');

        function adjustWheel() {
            const poster = document.getElementById('poster');
            if (poster.complete) {
                document.getElementById('wheel-box').style.width = (poster.clientWidth * 0.89) + "px";
            }
        }
        window.addEventListener('resize', adjustWheel);
        document.getElementById('poster').addEventListener('load', adjustWheel);

        function startSpin() {
            if (isSpinning) return;
            if (spinCount >= 2) {
                alert("Bạn đã tham gia đủ 2 lượt quay may mắn!");
                return;
            }

            isSpinning = true;
            
            // 1. Chọn giải thưởng ngẫu nhiên
            const prizeIndex = Math.floor(Math.random() * prizes.length);
            
            // 2. Tính toán góc dừng (Mũi tên ở vị trí 3 giờ - bên phải)
            const segmentDeg = 360 / prizes.length; // 60 độ mỗi ô
            const stopOffset = 90 - (prizeIndex * segmentDeg) - (segmentDeg / 2);
            
            // 3. LOGIC QUAY 1 CHIỀU: Luôn cộng thêm độ để góc quay tăng dần
            // Thêm 3600 độ (10 vòng) để tạo hiệu ứng quay nhanh
            const minRotation = 3600; 
            
            // Tính toán góc quay thực tế để dừng đúng giải thưởng mà vẫn đảm bảo quay xuôi chiều
            const currentMod = currentRotation % 360;
            let extraDeg = (stopOffset - currentMod + 360) % 360;
            
            // Nếu góc bù quá nhỏ, cộng thêm 1 vòng nữa cho đẹp
            if (extraDeg < 180) extraDeg += 360; 

            currentRotation += minRotation + extraDeg;
            
            // Thực hiện quay
            wheelImg.style.transform = `rotate(${currentRotation}deg)`;

            // 4. Hiển thị kết quả
            setTimeout(() => {
                isSpinning = false;
                spinCount++;
                localStorage.setItem('spin_dg_v12', spinCount);
                
                if (spinCount >= 2) spinBtn.classList.add('out-of-turns');
                showModal(prizes[prizeIndex].name);
            }, 5200); 
        }

        function showModal(name) {
            document.getElementById('prize-name').innerText = name;
            document.getElementById('modal').style.display = 'flex';
        }

        function closeModal() {
            document.getElementById('modal').style.display = 'none';
        }
    </script>
</body>
</html>
