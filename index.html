<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Vòng Quay May Mắn - Cổng Trời Đông Giang</title>
    <style>
        :root {
            --primary-green: #014321;
            --prize-red: #e60000;
            --light-green: #c1f0c1;
            --white: #ffffff;
        }

        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
        
        body {
            margin: 0; padding: 0;
            display: flex; justify-content: center; align-items: center;
            height: 100dvh; background-color: var(--primary-green);
            font-family: -apple-system, system-ui, sans-serif;
            overflow: hidden;
        }

        .poster-container {
            position: relative;
            height: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
            width: fit-content;
        }

        .bg-img {
            max-height: 100dvh;
            max-width: 100vw;
            display: block;
            object-fit: contain;
        }

        .wheel-area {
            position: absolute;
            top: 65.3%; 
            left: 50%;
            width: 89%; 
            transform: translate(-50%, -50%);
            z-index: 5;
        }

        .wheel-img {
            width: 100%;
            height: auto;
            /* 5 giây khớp với âm thanh bạn gửi */
            transition: transform 5s cubic-bezier(0.15, 0, 0.15, 1);
            will-change: transform;
        }

        .start-btn {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 32.5%;
            cursor: pointer;
            z-index: 10;
            touch-action: manipulation;
        }

        /* MODAL THÔNG BÁO */
        .modal-overlay {
            position: fixed; inset: 0;
            background: rgba(0,0,0,0.85);
            display: none; justify-content: center; align-items: center;
            z-index: 100;
        }

        .modal-content {
            background: var(--white);
            width: 85%; max-width: 350px;
            padding: 40px 20px 30px;
            border-radius: 25px; text-align: center;
            position: relative;
            animation: zoomIn 0.3s ease-out;
        }

        @keyframes zoomIn { from { opacity: 0; transform: scale(0.8); } to { opacity: 1; transform: scale(1); } }

        .close-x { position: absolute; top: 15px; right: 20px; font-size: 30px; color: #ccc; cursor: pointer; }
        .modal-content h2 { color: var(--primary-green) !important; margin: 0; font-size: 22px; font-weight: 800; text-transform: uppercase; }
        .modal-content p { color: #444; font-size: 18px; margin: 20px 0 0; }
        .modal-content b { color: var(--prize-red) !important; font-size: 22px; display: block; margin-top: 15px; margin-bottom: 30px; font-weight: 800; }
        .zalo-btn { display: inline-block; background-color: var(--light-green); color: #004d26; text-decoration: none; padding: 15px 20px; border-radius: 12px; font-weight: 700; font-size: 12px; text-transform: uppercase; border: 1px solid #a8e0a8; }
        .out-of-turns { filter: grayscale(1); cursor: not-allowed; opacity: 0.8; }
    </style>
</head>
<body>

    <audio id="gameSound" src="am-thanh.mp3.MP3" preload="auto"></audio>

    <div class="poster-container">
        <img src="nen-back.jpg" class="bg-img">
        <div class="wheel-area">
            <img src="vong-xoay.png" id="wheel" class="wheel-img">
            <!-- Nút bấm có mũi tên chỉ sang hướng 3h -->
            <img src="nut-quay.png" class="start-btn" id="spin-button" onclick="startSpin()">
        </div>
    </div>

    <div class="modal-overlay" id="modal">
        <div class="modal-content">
            <span class="close-x" onclick="closeModal()">&times;</span>
            <h2>CỔNG TRỜI ĐÔNG GIANG</h2>
            <p>Chúc mừng bạn đã nhận được:</p>
            <b id="prize-name"></b>
            <a href="https://zalo.me/1049758536530278164" target="_blank" class="zalo-btn">Zalo OA Cổng Trời Đông Giang</a>
        </div>
    </div>

    <script>
        // MẢNG QUÀ TẶNG KHỚP 100% THEO CHIỀU KIM ĐỒNG HỒ TỪ ĐỈNH (12h)
        const prizes = [
            { name: "TÚI VẢI", weight: 30 },                             // 0 - 60 độ
            { name: "VOUCHER MIỄN PHÍ VÉ THAM QUAN", weight: 5 },        // 60 - 120 độ
            { name: "TÚI THỔ CẨM", weight: 15 },                             // 120 - 180 độ
            { name: "STICKER", weight: 15 },                            // 180 - 240 độ
            { name: "VOUCHER GIẢM 100K", weight: 5 },                   // 240 - 300 độ
            { name: "QUẠT", weight: 30 }                                 // 300 - 360 độ
        ];

        const MAX_SPINS = 20;
        let isSpinning = false;
        let totalRotation = 0; 
        let spinCount = parseInt(localStorage.getItem('spin_dg_v20')) || 0;

        const wheel = document.getElementById('wheel');
        const spinBtn = document.getElementById('spin-button');
        const gameSound = document.getElementById('gameSound');

        if (spinCount >= MAX_SPINS) spinBtn.classList.add('out-of-turns');

        function startSpin() {
            if (isSpinning) return;
            if (spinCount >= MAX_SPINS) {
                alert("Bạn đã tham gia đủ 20 lượt quay!");
                return;
            }

            isSpinning = true;
            gameSound.currentTime = 0;
            gameSound.play().catch(e => {});

            // 1. Thuật toán chọn quà
            let totalWeight = prizes.reduce((sum, p) => sum + p.weight, 0);
            let random = Math.floor(Math.random() * totalWeight);
            let cumulativeWeight = 0;
            let prizeIndex = 0;

            for (let i = 0; i < prizes.length; i++) {
                cumulativeWeight += prizes[i].weight;
                if (random < cumulativeWeight) {
                    prizeIndex = i;
                    break;
                }
            }

            // 2. TOÁN HỌC CHÍNH XÁC CHO KIM Ở HƯỚNG 3 GIỜ (90 ĐỘ)
            const segmentDeg = 60; // 360 / 6 ô
            const pointerAngle = 90; // Kim (mũi tên vàng) nằm bên phải
            
            // Tâm của ô quà mục tiêu tính từ đỉnh (0 độ)
            const targetSliceCenter = (prizeIndex * segmentDeg) + (segmentDeg / 2);
            
            // Góc quay cần thiết để đưa 'targetSliceCenter' về đúng vị trí 'pointerAngle'
            const finalAngle = (pointerAngle - targetSliceCenter + 360) % 360;

            // Số vòng quay tối thiểu (5 vòng)
            const minSpins = 1800; 

            // Cộng dồn để vòng quay luôn quay xuôi chiều
            const currentMod = totalRotation % 360;
            let extraDeg = (finalAngle - currentMod + 360) % 360;
            
            // Đảm bảo không quay quá ngắn
            if (extraDeg < 45) extraDeg += 360;

            totalRotation += minSpins + extraDeg;

            // 3. XOAY
            wheel.style.transform = `rotate(${totalRotation}deg)`;

            // 4. HIỆN KẾT QUẢ
            setTimeout(() => {
                isSpinning = false;
                spinCount++;
                localStorage.setItem('spin_dg_v20', spinCount);
                if (spinCount >= MAX_SPINS) spinBtn.classList.add('out-of-turns');
                
                showModal(prizes[prizeIndex].name);
            }, 5000); 
        }

        function showModal(name) {
            document.getElementById('prize-name').innerText = name;
            document.getElementById('modal').style.display = 'flex';
        }

        function closeModal() {
            document.getElementById('modal').style.display = 'none';
        }
    </script>
</body>
</html>
