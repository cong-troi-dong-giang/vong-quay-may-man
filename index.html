<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Vòng Quay May Mắn - Cổng Trời Đông Giang</title>
    <style>
        :root {
            --primary-green: #014321;
            --prize-red: #e60000;
            --light-green: #c1f0c1;
            --white: #ffffff;
        }

        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
        
        body {
            margin: 0; padding: 0;
            display: flex; justify-content: center; align-items: center;
            height: 100dvh; background-color: var(--primary-green);
            font-family: -apple-system, system-ui, sans-serif;
            overflow: hidden;
        }

        .poster-container {
            position: relative;
            height: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
            width: fit-content;
        }

        .bg-img {
            max-height: 100dvh;
            max-width: 100vw;
            display: block;
            object-fit: contain;
        }

        .wheel-area {
            position: absolute;
            top: 65.3%; 
            left: 50%;
            width: 89%; 
            transform: translate(-50%, -50%);
            z-index: 5;
        }

        .wheel-img {
            width: 100%;
            height: auto;
            transition: transform 5s cubic-bezier(0.15, 0, 0.15, 1);
            will-change: transform;
        }

        .start-btn {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 32.5%;
            cursor: pointer;
            z-index: 10;
            touch-action: manipulation;
        }

        .modal-overlay {
            position: fixed; inset: 0;
            background: rgba(0,0,0,0.85);
            display: none; justify-content: center; align-items: center;
            z-index: 100;
        }

        .modal-content {
            background: var(--white);
            width: 90%; max-width: 400px;
            padding: 40px 20px 30px;
            border-radius: 25px; text-align: center;
            position: relative;
            animation: zoomIn 0.3s ease-out;
        }

        @keyframes zoomIn { from { opacity: 0; transform: scale(0.8); } to { opacity: 1; transform: scale(1); } }

        .close-x { position: absolute; top: 10px; right: 20px; font-size: 35px; color: #ccc; cursor: pointer; }
        
        .modal-content h2 { color: var(--primary-green) !important; margin: 0; font-size: 20px; font-weight: 800; text-transform: uppercase; line-height: 1.2; }
        .modal-content h2 span { display: block; font-size: 14px; opacity: 0.8; }

        .modal-content p { color: #444; font-size: 16px; margin: 20px 0 0; line-height: 1.4; }
        .modal-content p i { display: block; font-size: 14px; color: #666; font-style: normal; }

        .prize-container { margin-top: 15px; margin-bottom: 30px; }
        .prize-vi { color: var(--prize-red) !important; font-size: 24px; display: block; font-weight: 800; text-transform: uppercase; }
        .prize-en { color: var(--prize-red) !important; font-size: 18px; display: block; font-weight: 600; text-transform: uppercase; opacity: 0.9; }

        .zalo-btn { display: inline-block; background-color: var(--light-green); color: #004d26; text-decoration: none; padding: 12px 20px; border-radius: 12px; font-weight: 700; font-size: 11px; text-transform: uppercase; border: 1px solid #a8e0a8; line-height: 1.4; }
        .zalo-btn span { display: block; font-size: 10px; opacity: 0.8; }
        
        .out-of-turns { filter: grayscale(1); cursor: not-allowed; opacity: 0.8; }
    </style>
</head>
<body>

    <audio id="gameSound" src="am-thanh.mp3.MP3" preload="auto"></audio>

    <div class="poster-container">
        <img src="nen-back.jpg" class="bg-img">
        <div class="wheel-area">
            <img src="vong-xoay.png" id="wheel" class="wheel-img">
            <img src="nut-quay.png" class="start-btn" id="spin-button" onclick="startSpin()">
        </div>
    </div>

    <div class="modal-overlay" id="modal">
        <div class="modal-content">
            <span class="close-x" onclick="closeModal()">&times;</span>
            <h2>CỔNG TRỜI ĐÔNG GIANG <span>DONG GIANG HEAVEN GATE</span></h2>
            
            <p>Chúc mừng bạn đã nhận được: <i>Congratulations! You have received:</i></p>
            
            <div class="prize-container">
                <span id="prize-vi" class="prize-vi"></span>
                <span id="prize-en" class="prize-en"></span>
            </div>

            <a href="https://zalo.me/1049758536530278164" target="_blank" class="zalo-btn">
                Zalo OA Cổng Trời Đông Giang
                <span>Official Account Dong Giang Heaven Gate</span>
            </a>
        </div>
    </div>

    <script>
        // Cập nhật danh sách quà tặng song ngữ
        const prizes = [
            { vi: "TÚI VẢI", en: "Canvas Bag", weight: 30 },
            { vi: "VOUCHER MIỄN PHÍ VÉ THAM QUAN", en: "Free Sightseeing Voucher", weight: 5 },
            { vi: "TÚI THỔ CẨM", en: "Brocade Bag", weight: 15 },
            { vi: "STICKER", en: "Sticker", weight: 15 },
            { vi: "VOUCHER GIẢM 100K", en: "100K Discount Voucher", weight: 5 },
            { vi: "QUẠT", en: "Hand Fan", weight: 30 }
        ];

        const MAX_SPINS = 2; 
        let isSpinning = false;
        let totalRotation = 0; 
        
        let spinCount = parseInt(localStorage.getItem('spin_dg_v2')) || 0;

        const wheel = document.getElementById('wheel');
        const spinBtn = document.getElementById('spin-button');
        const gameSound = document.getElementById('gameSound');

        if (spinCount >= MAX_SPINS) spinBtn.classList.add('out-of-turns');

        function startSpin() {
            if (isSpinning) return;
            if (spinCount >= MAX_SPINS) {
                alert("Bạn đã tham gia đủ 2 lượt quay! \nYou have used all 2 turns!");
                return;
            }

            isSpinning = true;
            gameSound.currentTime = 0;
            gameSound.play().catch(e => {});

            let totalWeight = prizes.reduce((sum, p) => sum + p.weight, 0);
            let random = Math.floor(Math.random() * totalWeight);
            let cumulativeWeight = 0;
            let prizeIndex = 0;

            for (let i = 0; i < prizes.length; i++) {
                cumulativeWeight += prizes[i].weight;
                if (random < cumulativeWeight) {
                    prizeIndex = i;
                    break;
                }
            }

            const segmentDeg = 60;
            const pointerAngle = 90; 
            const targetSliceCenter = (prizeIndex * segmentDeg) + (segmentDeg / 2);
            const finalAngle = (pointerAngle - targetSliceCenter + 360) % 360;
            const minSpins = 1800; 

            const currentMod = totalRotation % 360;
            let extraDeg = (finalAngle - currentMod + 360) % 360;
            
            if (extraDeg < 45) extraDeg += 360;

            totalRotation += minSpins + extraDeg;
            wheel.style.transform = `rotate(${totalRotation}deg)`;

            setTimeout(() => {
                isSpinning = false;
                spinCount++;
                localStorage.setItem('spin_dg_v2', spinCount);
                if (spinCount >= MAX_SPINS) spinBtn.classList.add('out-of-turns');
                
                showModal(prizes[prizeIndex]);
            }, 5000); 
        }

        function showModal(prizeObj) {
            document.getElementById('prize-vi').innerText = prizeObj.vi;
            document.getElementById('prize-en').innerText = prizeObj.en;
            document.getElementById('modal').style.display = 'flex';
        }

        function closeModal() {
            document.getElementById('modal').style.display = 'none';
        }
    </script>
</body>
</html>
